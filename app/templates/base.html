<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShortVotes - 초간편 단기 이벤트 투표{% endblock %}</title>
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/{{ prefix }}/static/css/custom.css">
    <script>
        window.APP_PREFIX = "/{{ prefix }}";
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">
    <!-- 네비게이션 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/{{ prefix }}/" class="flex items-center gap-2 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-fuchsia-600 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-md group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-square-poll-vertical"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-extrabold text-lg text-slate-900 tracking-tight leading-tight">ShortVotes</span>
                    <span class="text-xs text-slate-500 font-medium">초간편 단기 선호도 조사</span>
                </div>
            </a>
            <div class="flex items-center gap-2 sm:gap-3">
                <a href="/{{ prefix }}/events" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-slate-700 hover:text-indigo-600 hover:bg-slate-100 text-xs sm:text-sm font-semibold transition-colors">
                    <i class="fa-solid fa-layer-group text-xs text-indigo-500"></i>
                    <span>이벤트 목록 및 관리</span>
                </a>
                <a href="/{{ prefix }}/new" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold shadow-sm transition-colors">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>이벤트 만들기</span>
                </a>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- 푸터 -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-auto text-center text-xs text-slate-500">
        <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <span>&copy; 2026 ShortVotes. 무인증 초고속 선호조사 시스템.</span>
            <div class="flex items-center gap-4 text-slate-400">
                <span class="flex items-center gap-1"><i class="fa-solid fa-bolt text-amber-500"></i> Gemini 2.5 Flash OCR</span>
                <span class="flex items-center gap-1"><i class="fa-solid fa-shield-halved text-emerald-500"></i> Local Storage ID</span>
            </div>
        </div>
    </footer>

    <!-- 글로벌 토스트 알림 컨테이너 -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script src="/{{ prefix }}/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
